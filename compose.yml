services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: veil
      POSTGRES_USER: veil
      POSTGRES_PASSWORD: ${VEIL_DB_PASSWORD:?Set VEIL_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["veil-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veil -d veil"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  veil-postgres:
